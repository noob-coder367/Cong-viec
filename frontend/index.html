<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b16"><meta name="description" content="Cong-viec Chat"><title>Cong-viec · Chat</title>
<style>
:root{color-scheme:dark;--bg:#080b16;--panel:#12182bcc;--line:#ffffff18;--muted:#929db7;--text:#f5f7ff;--accent:#a78bfa;--cyan:#67e8f9}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse at 15% 10%,#7c3aed24,transparent 40%),radial-gradient(ellipse at 90% 90%,#0891b222,transparent 42%),var(--bg)}
button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
#gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:22px}.gate-wrap{width:min(100%,410px);animation:rise .6s ease both}.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px;letter-spacing:.16em;font-size:12px;font-weight:800;color:#c7d2fe}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,#a78bfa,#22d3ee);color:#090b16}
.panel{padding:clamp(25px,7vw,36px);border:1px solid var(--line);border-radius:26px;background:var(--panel);backdrop-filter:blur(22px);box-shadow:0 30px 90px #0006;text-align:center}.lock{width:58px;height:58px;margin:0 auto 20px;border-radius:19px;display:grid;place-items:center;background:#a78bfa20;border:1px solid #c4b5fd33;color:#c4b5fd}
h1{font-size:28px;letter-spacing:-.04em;margin:0 0 9px}.sub{margin:0 auto 25px;color:var(--muted);font-size:14px;line-height:1.6;max-width:285px}.pin{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin-bottom:16px}.pin input{width:100%;min-width:0;aspect-ratio:.78;border-radius:13px;border:1px solid #ffffff20;background:#080b16a8;color:white;text-align:center;font-size:25px;font-weight:700;outline:none}.pin input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #a78bfa20}.hint{min-height:22px;margin:0;font-size:12px;color:var(--muted)}.hint.error{color:#fda4af}.hint.success{color:var(--cyan)}
#chat-app{display:none;min-height:100vh;min-height:100dvh;padding:20px}.chat-shell{width:min(100%,1000px);height:min(850px,calc(100dvh - 40px));min-height:520px;margin:auto;border:1px solid var(--line);border-radius:25px;background:#0c1020e8;box-shadow:0 25px 100px #0006;display:flex;flex-direction:column;overflow:hidden;animation:rise .5s ease both}
.chat-head{display:flex;align-items:center;gap:13px;padding:19px 22px;border-bottom:1px solid var(--line);background:#ffffff04}.avatar{width:45px;height:45px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#22d3ee);color:#090b16;font-weight:900;font-size:20px}.head-copy{min-width:0;flex:1}.head-copy h2{font-size:17px;margin:0 0 4px}.head-copy p{font-size:12px;color:var(--muted);margin:0}.online{display:inline-block;width:7px;height:7px;background:#34d399;border-radius:50%;margin-right:6px}.ghost-btn{border:1px solid var(--line);border-radius:12px;background:#ffffff08;color:#cbd5e1;padding:9px 11px;font-size:12px}
.profile{display:flex;gap:9px;align-items:center;padding:12px 18px;border-bottom:1px solid #ffffff0c}.profile label{font-size:12px;color:var(--muted);white-space:nowrap}.profile input{min-width:0;flex:1;border:1px solid #ffffff18;border-radius:10px;background:#ffffff06;padding:9px 11px;color:var(--text);outline:none}.profile input:focus,.composer textarea:focus{border-color:#a78bfa88}
.messages{flex:1;overflow:auto;padding:22px 18px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth;transition:background .2s,outline .2s}.drop-active{outline:2px dashed #a78bfa;outline-offset:-10px;background:#a78bfa0c}.empty{margin:auto;text-align:center;max-width:270px;color:var(--muted);font-size:13px;line-height:1.65}.empty-icon{font-size:30px;margin-bottom:12px}.msg{max-width:min(78%,600px);align-self:flex-start;animation:pop .2s ease}.msg.mine{align-self:flex-end}.msg-meta{display:flex;align-items:center;gap:8px;margin:0 7px 5px;font-size:11px;color:var(--muted)}.msg.mine .msg-meta{justify-content:flex-end}.bubble{border:1px solid #ffffff12;border-radius:5px 17px 17px 17px;background:#ffffff0a;padding:11px 14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:14px}.msg.mine .bubble{background:linear-gradient(135deg,#6d4bc833,#0891b222);border-color:#a78bfa35;border-radius:17px 5px 17px 17px}.msg-time{opacity:.7;font-size:10px}.composer{padding:14px 16px 17px;border-top:1px solid var(--line);background:#ffffff03}.composer-row{display:flex;align-items:flex-end;gap:10px}.composer textarea{resize:none;flex:1;min-width:0;max-height:130px;min-height:45px;border:1px solid #ffffff1c;border-radius:14px;background:#080b16c9;padding:12px 13px;color:var(--text);outline:none;line-height:1.4}.send{height:45px;width:48px;border:0;border-radius:14px;background:linear-gradient(135deg,#a78bfa,#67e8f9);color:#090b16;font-size:19px;font-weight:900;box-shadow:0 5px 25px #8b5cf633}.attach-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px;color:#717d98;font-size:11px}.attach{border:1px dashed #a78bfa66;border-radius:10px;padding:7px 10px;background:#a78bfa0d;color:#c4b5fd;font-size:12px}.status{color:var(--muted);font-size:11px;min-height:16px}.status.error{color:#fda4af}.preview-list{display:flex;gap:8px;overflow:auto;padding:8px 0 0}.preview-item{position:relative;flex:0 0 74px;height:74px;border:1px solid #ffffff20;border-radius:10px;overflow:hidden;background:#080b16}.preview-item img,.preview-item video{width:100%;height:100%;object-fit:cover}.preview-item span{position:absolute;inset:auto 3px 3px;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#000b;padding:2px 3px}.preview-remove{position:absolute;right:3px;top:3px;width:19px;height:19px;border:0;border-radius:50%;background:#000b;color:#fff;font-size:12px;z-index:1}.attachment-media{display:block;max-width:min(360px,70vw);max-height:360px;border-radius:13px;margin-top:8px;cursor:zoom-in}.date-divider{text-align:center;color:var(--muted);font-size:10px;margin:5px 0}.sender-avatar{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#a78bfa33;color:#ddd6fe;font-size:10px;font-weight:700}.attachment-file{display:flex;align-items:center;gap:8px;color:#c4b5fd;text-decoration:none;margin-top:8px;font-size:12px}.upload-progress{height:3px;border-radius:4px;background:#ffffff18;margin-top:7px;overflow:hidden}.upload-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a78bfa,#67e8f9);transition:width .1s}.image-viewer{position:fixed;inset:0;z-index:10000;background:#02040dcc;backdrop-filter:blur(12px);display:grid;place-items:center;padding:24px}.image-viewer[hidden]{display:none}.image-viewer img{max-width:96vw;max-height:92vh;object-fit:contain;border-radius:12px;box-shadow:0 20px 100px #000}.image-viewer-close{position:absolute;right:18px;top:14px;width:44px;height:44px;border:1px solid #ffffff44;border-radius:50%;background:#111827dd;color:#fff;font-size:30px;line-height:1;cursor:pointer}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(max-width:560px){#chat-app{padding:0}.chat-shell{width:100%;height:100dvh;min-height:0;border-radius:0;border:0}.chat-head{padding:15px}.messages{padding:17px 12px}.msg{max-width:88%}.profile{padding:10px 12px}.composer{padding:12px}.head-copy h2{font-size:16px}.ghost-btn{padding:8px}.attach-row{align-items:flex-start;flex-direction:column}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<section id="gate">
  <div class="gate-wrap">
    <div class="brand"><span class="brand-mark">✦</span><span>CONG-VIEC</span></div>
    <div class="panel">
      <div class="lock" aria-hidden="true">🔐</div><h1>Chào mừng trở lại</h1><p class="sub">Nhập mã truy cập 6 chữ số để vào phòng chat riêng</p>
      <form id="pin-form"><div class="pin" id="pin-inputs" role="group" aria-label="Mã PIN gồm 6 chữ số">
        <input aria-label="Chữ số 1" inputmode="numeric" maxlength="1" type="password" autocomplete="one-time-code" required>
        <input aria-label="Chữ số 2" inputmode="numeric" maxlength="1" type="password" required>
        <input aria-label="Chữ số 3" inputmode="numeric" maxlength="1" type="password" required>
        <input aria-label="Chữ số 4" inputmode="numeric" maxlength="1" type="password" required>
        <input aria-label="Chữ số 5" inputmode="numeric" maxlength="1" type="password" required>
        <input aria-label="Chữ số 6" inputmode="numeric" maxlength="1" type="password" required>
      </div><p class="hint" id="pin-hint" role="status">Mã truy cập được bảo vệ</p></form>
    </div>
  </div>
</section>
<section id="chat-app">
  <main class="chat-shell">
    <header class="chat-head"><div class="avatar">✦</div><div class="head-copy"><h2>Phòng chat chung</h2><p><span class="online"></span><span id="connection-label">Đang kết nối</span></p></div><button class="ghost-btn" id="lock-btn" type="button">Khóa lại</button></header>
    <div class="profile"><label for="sender-name">Tên hiển thị</label><input id="sender-name" maxlength="40" placeholder="Nhập tên của bạn" autocomplete="nickname"></div>
    <div class="messages" id="messages" aria-live="polite"><div class="empty"><div class="empty-icon">✦</div><strong>Không gian trò chuyện của bạn</strong><br>Gửi tin nhắn đầu tiên để bắt đầu cuộc trò chuyện.</div></div>
    <form class="composer" id="message-form"><div id="preview-list" class="preview-list" hidden></div><div class="composer-row"><textarea id="message-input" rows="1" maxlength="4000" placeholder="Nhập tin nhắn..." aria-label="Nội dung tin nhắn"></textarea><button class="send" id="send-btn" type="submit" aria-label="Gửi tin nhắn">➤</button></div><div class="attach-row"><button class="attach" id="attach-btn" type="button">＋ Đính kèm tệp</button><input id="file-input" type="file" multiple hidden accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip,.rar"><span id="status" class="status">Tin nhắn lưu Supabase · tệp lưu Drive</span></div></form>
  </main>
</section>
<div id="image-viewer" class="image-viewer" hidden><button id="image-viewer-close" class="image-viewer-close" type="button" aria-label="Đóng">×</button><img id="image-viewer-image" alt="Ảnh xem lớn"></div>
<script>
(() => {
  const API = "https://cong-viec.onrender.com";
  const gate = document.getElementById("gate"), app = document.getElementById("chat-app");
  const pinInputs = [...document.querySelectorAll("#pin-inputs input")], pinHint = document.getElementById("pin-hint");
  const messagesEl = document.getElementById("messages"), nameInput = document.getElementById("sender-name");
  const input = document.getElementById("message-input"), form = document.getElementById("message-form");
  const statusEl = document.getElementById("status"), connectionLabel = document.getElementById("connection-label");
  let token = "", pollTimer = null, loading = false, lastSignature = "";
  nameInput.value = localStorage.getItem("cong-viec-chat-name") || "";

  function showPinMessage(text, error=false){pinHint.textContent=text;pinHint.className="hint"+(error?" error":"");}
  async function verifyPin(){
    const pin=pinInputs.map(i=>i.value).join("");
    if(pin.length!==6||loading)return;
    loading=true;pinInputs.forEach(i=>i.disabled=true);showPinMessage("Đang xác nhận...");
    try{
      const r=await fetch(API+"/api/verify-pin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin}),cache:"no-store"});
      const data=await r.json().catch(()=>({}));
      if(!r.ok||!data.valid||!data.token)throw new Error(r.status===429?"Bạn đã thử quá nhiều lần. Chờ một lúc nhé.":r.status>=500?"Máy chủ chưa sẵn sàng.":"Mã chưa đúng, thử lại nhé.");
      token=data.token;gate.style.display="none";app.style.display="block";input.focus();await loadMessages(true);pollTimer=setInterval(()=>loadMessages(false),3500);
    }catch(e){showPinMessage(e.message||"Không kết nối được máy chủ.",true);pinInputs.forEach(i=>i.value="");pinInputs[0].focus();}
    finally{loading=false;pinInputs.forEach(i=>i.disabled=false);}
  }
  pinInputs.forEach((el,i)=>{
    el.addEventListener("input",()=>{el.value=el.value.replace(/\D/g,"").slice(-1);if(el.value&&i<pinInputs.length-1)pinInputs[i+1].focus();if(pinInputs.every(x=>x.value))verifyPin();});
    el.addEventListener("keydown",e=>{if(e.key==="Backspace"&&!el.value&&i>0)pinInputs[i-1].focus();if(e.key==="ArrowLeft"&&i>0)pinInputs[i-1].focus();if(e.key==="ArrowRight"&&i<pinInputs.length-1)pinInputs[i+1].focus();});
    el.addEventListener("paste",e=>{e.preventDefault();const ds=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,6);ds.split("").forEach((d,j)=>pinInputs[j].value=d);if(ds.length===6)verifyPin();else pinInputs[Math.min(ds.length,5)].focus();});
  });
  document.getElementById("pin-form").addEventListener("submit",e=>e.preventDefault());

  function apiFetch(path,options={}){return fetch(API+path,{...options,headers:{...(options.headers||{}),Authorization:"Bearer "+token}});}
  function timeLabel(value){try{return new Intl.DateTimeFormat("vi-VN",{hour:"2-digit",minute:"2-digit"}).format(new Date(value));}catch{return "";}}
  function dateLabel(value){try{return new Intl.DateTimeFormat("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric"}).format(new Date(value));}catch{return "";}}
  function renderMessages(list){
    const nearBottom=messagesEl.scrollHeight-messagesEl.scrollTop-messagesEl.clientHeight<100;
    messagesEl.replaceChildren();
    if(!list.length){const empty=document.createElement("div");empty.className="empty";empty.innerHTML='<div class="empty-icon">✦</div><strong>Không gian trò chuyện của bạn</strong><br>Gửi tin nhắn đầu tiên để bắt đầu cuộc trò chuyện.';messagesEl.appendChild(empty);return;}
    let previousDate="";
    for(const m of list){
      const currentDate=dateLabel(m.created_at);
      if(currentDate!==previousDate){const divider=document.createElement("div");divider.className="date-divider";divider.textContent=currentDate;messagesEl.appendChild(divider);previousDate=currentDate;}
      const wrap=document.createElement("article");wrap.className="msg"+(m.sender_name===nameInput.value.trim()?" mine":"");
      const meta=document.createElement("div");meta.className="msg-meta";
      const avatar=document.createElement("span");avatar.textContent=(m.sender_name||"?").trim().charAt(0).toUpperCase();avatar.className="sender-avatar";
      const sender=document.createElement("span");sender.textContent=m.sender_name;
      const time=document.createElement("span");time.className="msg-time";time.textContent=timeLabel(m.created_at);
      meta.append(avatar,sender,time);
      const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=m.content;
      wrap.append(meta,bubble);
      if(Array.isArray(m.chat_attachments))m.chat_attachments.forEach(file=>{
        const url=API+"/api/chat/attachments/"+encodeURIComponent(file.id)+"/content";
        const type=file.mime_type||"";
        if(type.startsWith("image/")){const img=document.createElement("img");img.alt=file.file_name;img.className="attachment-media";img.addEventListener("click",()=>openImageViewer(img.src));loadPrivateMedia(img,url);wrap.appendChild(img);}
        else if(type.startsWith("video/")){const video=document.createElement("video");video.controls=true;video.preload="metadata";video.className="attachment-media";loadPrivateMedia(video,url);wrap.appendChild(video);}
        else {const a=document.createElement("a");a.href="#";a.className="attachment-file";a.textContent="📎 "+file.file_name+" · "+formatSize(file.size_bytes);a.addEventListener("click",e=>{e.preventDefault();downloadPrivateFile(url,file.file_name);});wrap.appendChild(a);}
      });
      messagesEl.appendChild(wrap);
    }
    if(nearBottom)messagesEl.scrollTop=messagesEl.scrollHeight;
  }
  async function loadPrivateMedia(element,url){try{const r=await apiFetch(url,{cache:"no-store"});if(!r.ok)throw new Error();element.src=URL.createObjectURL(await r.blob());}catch{element.alt="Không tải được tệp";}}
  async function downloadPrivateFile(url,name){try{const r=await apiFetch(url,{cache:"no-store"});if(!r.ok)throw new Error();const blob=URL.createObjectURL(await r.blob());const a=document.createElement("a");a.href=blob;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(blob),2000);}catch{statusEl.textContent="Không tải được tệp.";statusEl.className="status error";}}
  function openImageViewer(src){if(!src)return;imageViewerImage.src=src;imageViewer.hidden=false;document.body.style.overflow="hidden";}
  function closeImageViewer(){imageViewer.hidden=true;imageViewerImage.removeAttribute("src");document.body.style.overflow="";}
  imageViewer.addEventListener("click",e=>{if(e.target===imageViewer)closeImageViewer();});document.getElementById("image-viewer-close").addEventListener("click",closeImageViewer);document.addEventListener("keydown",e=>{if(e.key==="Escape")closeImageViewer();});
  function formatSize(value){const n=Number(value||0);if(n<1024)return n+" B";if(n<1024*1024)return Math.round(n/1024)+" KB";return (n/1024/1024).toFixed(1)+" MB";}
  async function loadMessages(initial){
    if(!token)return;
    try{
      const r=await apiFetch("/api/chat/messages?limit=100",{cache:"no-store"});
      if(r.status===401){lockChat();return;}
      if(!r.ok)throw new Error("Không tải được tin nhắn.");
      const data=await r.json(),list=data.messages||[];
      const signature=list.length?list[list.length-1].id+":"+list.length:"empty";
      if(signature!==lastSignature||initial){lastSignature=signature;renderMessages(list);}
      connectionLabel.textContent="Đang hoạt động";statusEl.textContent="Tin nhắn lưu Supabase · tệp lưu Drive";statusEl.className="status";
    }catch{connectionLabel.textContent="Đang thử kết nối lại";statusEl.textContent="Mất kết nối tạm thời, sẽ tự thử lại.";statusEl.className="status error";}
  }
  form.addEventListener("submit",async e=>{
    e.preventDefault();const sender=nameInput.value.trim(),content=input.value.trim();
    if(!sender){statusEl.textContent="Nhập tên hiển thị trước khi gửi.";statusEl.className="status error";nameInput.focus();return;}
    if(!content)return;
    localStorage.setItem("cong-viec-chat-name",sender);document.getElementById("send-btn").disabled=true;
    try{
      const r=await apiFetch("/api/chat/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sender_name:sender,content})});
      const data=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(data.error||"Gửi tin nhắn thất bại.");
      input.value="";input.style.height="auto";await loadMessages(true);input.focus();
    }catch(err){statusEl.textContent=err.message||"Không gửi được tin nhắn.";statusEl.className="status error";}
    finally{document.getElementById("send-btn").disabled=false;}
  });
  input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,130)+"px";});
  input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});
  nameInput.addEventListener("change",()=>localStorage.setItem("cong-viec-chat-name",nameInput.value.trim()));
  const fileInput=document.getElementById("file-input"), previewList=document.getElementById("preview-list");
  const attachButton=document.getElementById("attach-btn");
  let pendingFiles=[];
  function renderPreview(){
    previewList.replaceChildren();previewList.hidden=!pendingFiles.length;
    pendingFiles.forEach((file,index)=>{
      const item=document.createElement("div");item.className="preview-item";
      const remove=document.createElement("button");remove.type="button";remove.className="preview-remove";remove.textContent="×";remove.onclick=()=>{pendingFiles.splice(index,1);renderPreview();};item.appendChild(remove);
      if(file.type.startsWith("image/")||file.type.startsWith("video/")){const media=document.createElement(file.type.startsWith("video/")?"video":"img");media.src=URL.createObjectURL(file);if(media.tagName==="VIDEO")media.muted=true;item.appendChild(media);}
      const label=document.createElement("span");label.textContent=file.name;item.appendChild(label);previewList.appendChild(item);
    });
    attachButton.textContent=pendingFiles.length?"Gửi "+pendingFiles.length+" tệp":"＋ Đính kèm tệp";
  }
  function queueFiles(files){
    const accepted=[...files].filter(file=>{if(file.size>25*1024*1024){statusEl.textContent=file.name+" vượt quá giới hạn 25 MB.";statusEl.className="status error";return false;}return true;});
    pendingFiles.push(...accepted);renderPreview();
  }
  function uploadFile(file,sender){
    return new Promise((resolve,reject)=>{
      const xhr=new XMLHttpRequest();xhr.open("POST",API+"/api/chat/attachments");xhr.setRequestHeader("Authorization","Bearer "+token);xhr.setRequestHeader("Content-Type",file.type||"application/octet-stream");xhr.setRequestHeader("X-File-Name",encodeURIComponent(file.name));xhr.setRequestHeader("X-Chat-Sender",sender);
      xhr.upload.onprogress=e=>{if(e.lengthComputable){const percent=Math.round(e.loaded/e.total*100);statusEl.textContent="Đang tải "+file.name+" · "+percent+"%";const bar=document.querySelector(".upload-progress i");if(bar)bar.style.width=percent+"%";}};
      xhr.onerror=()=>reject(new Error("Mất kết nối khi tải "+file.name));
      xhr.onload=()=>{let data={};try{data=JSON.parse(xhr.responseText||"{}")}catch{};if(xhr.status>=200&&xhr.status<300)resolve(data);else{const error=new Error(data.error||"Tải tệp thất bại.");error.status=xhr.status;error.data=data;reject(error);}};
      xhr.send(file);
    });
  }
  async function uploadSelectedFiles(files){
    const sender=nameInput.value.trim();
    if(!sender){statusEl.textContent="Nhập tên hiển thị trước khi gửi tệp.";statusEl.className="status error";nameInput.focus();return;}
    if(!files.length)return;localStorage.setItem("cong-viec-chat-name",sender);attachButton.disabled=true;
    const progress=document.createElement("div");progress.className="upload-progress";progress.innerHTML="<i></i>";previewList.appendChild(progress);
    for(const file of [...files]){
      try{await uploadFile(file,sender);lastSignature="";await loadMessages(true);statusEl.textContent="Đã gửi "+file.name;statusEl.className="status";}
      catch(err){
        if(err.status===401){lockChat();return;}
        if(err.status===403&&/cấp lại quyền/i.test(err.data?.error||"")){try{const reconnect=await apiFetch("/api/chat/drive/reconnect",{method:"POST"});const data=await reconnect.json().catch(()=>({}));if(reconnect.ok&&data.url){window.open(data.url,"_blank","noopener,noreferrer");statusEl.textContent="Đã mở Google để cấp lại quyền. Xong rồi hãy gửi lại tệp.";statusEl.className="status error";break;}}catch{}}
        statusEl.textContent=err.message||("Không gửi được "+file.name);statusEl.className="status error";
      }
    }
    pendingFiles=[];renderPreview();attachButton.disabled=false;
  }
  attachButton.addEventListener("click",()=>{if(pendingFiles.length){const files=[...pendingFiles];uploadSelectedFiles(files);}else fileInput.click();});
  fileInput.addEventListener("change",()=>{queueFiles(fileInput.files);fileInput.value="";});
  messagesEl.addEventListener("dragover",e=>{e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect="copy";messagesEl.classList.add("drop-active");});
  messagesEl.addEventListener("dragleave",e=>{if(!messagesEl.contains(e.relatedTarget))messagesEl.classList.remove("drop-active");});
  messagesEl.addEventListener("drop",e=>{e.preventDefault();messagesEl.classList.remove("drop-active");if(e.dataTransfer?.files?.length)queueFiles(e.dataTransfer.files);});
  function lockChat(){token="";if(pollTimer)clearInterval(pollTimer);pollTimer=null;lastSignature="";app.style.display="none";gate.style.display="grid";pinInputs.forEach(i=>i.value="");showPinMessage("Phiên đã hết hạn. Nhập mã để tiếp tục.");pinInputs[0].focus();}
  document.getElementById("lock-btn").addEventListener("click",lockChat);
  pinInputs[0].focus();
})();
</script>
</body></html>
